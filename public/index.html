<!doctype html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
        <title>G</title>
        <style>
            html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#111; color:#aaa; font-family:monospace; user-select:none; }
            
            #crosshair { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:24px; pointer-events:none; color:#fff; opacity:0.4; }
        </style>
    </head>
    <body>
        <script src="config.js"></script>
        <script src="g.js"></script>
        <script src="g.math.js"></script>
        <script src="g.shader.js"></script>
        <script src="g.camera.js"></script>
        <script src="g.input.js"></script>
        <script src="g.input.mousekeyb.js"></script>
        <script src="g.input.touch.js"></script>
        <script src="g.input.gamepad.js"></script>
        <script src="g.input.gamepad.debug.js"></script>
        <script src="g.player.js"></script>
        <script src="g.controller.js"></script>
        <script src="g.controller.SpaceshipFlightQuaternion.js"></script>
        <script src="g.controller.SpaceshipAutopilot.js"></script>
        <script src="g.controller.FirstPerson.js"></script>
        <script src="g.controller.ThirdPerson.js"></script>
        <script src="g.controller.TopDown.js"></script>
        <script src="g.controller.Isometric.js"></script>
        <script src="g.controller.SideScroller.js"></script>
        <script src="g.ship.js"></script>
        <script src="g.shapes.js"></script>
        <script src="g.pick.js"></script>
        <script src="g.renderer.js"></script>
        <script src="g.renderer.map.js"></script>
        <script src="g.renderer.map.cubeTiles.js"></script>
        <script src="g.renderer.map.cubeTiles.stars.js"></script>
        <script src="g.renderer.map.targetLine.js"></script>
        <script src="g.renderer.map.nebula.js"></script>
        <script src="g.renderer.player.js"></script>
        <script src="g.map.js"></script>
        <script src="g.map.nebula.js"></script>
        <script src="g.crosshair.js"></script>
        <script src="g.hud.js"></script>

        <script src="g.renderer.sphereTest.js"></script>
        <script>
        // ============================================================
        //  main update loop
        // ============================================================
        g.updateHandlers.push(function mainLoop(dt) {
            g.input.update(dt);
            g.controller.update(dt);
            g.map.update(dt);
            g.camera.update(dt);
            g.renderer.draw();
            g.hud.update(dt);
        });
        </script>
    </body>
</html>
